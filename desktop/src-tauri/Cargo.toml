[package]
name = "vocavid-desktop"
version = "1.1.2"
description = "Standalone desktop launcher for VocaVid"
authors = ["VocaVid contributors"]
edition = "2021"

[lib]
name = "vocavid_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
url = "2"
